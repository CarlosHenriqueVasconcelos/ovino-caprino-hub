name: bego_ovino_caprino
description: Sistema de Gestão para Ovinocultura e Caprinocultura

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  uuid: ^4.5.0
  supabase_flutter: ^2.3.4
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.2
  intl: 0.20.2
  path: ^1.9.0
  supabase: ^2.3.4
  share_plus: ^10.1.4
  connectivity_plus: ^6.0.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.2

flutter_native_splash:
  color: "#2F8F5B"
  android: true
  ios: true
  android_12:
    color: "#2F8F5B"

flutter_launcher_icons:
  image_path: "assets/branding/terra_tech_source.png"
  android: false
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/cards/
    - assets/icons/cards/
