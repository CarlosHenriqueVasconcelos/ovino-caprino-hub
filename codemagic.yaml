workflows:
  ios-testflight:
    name: iOS - Build e TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      vars:
        BUNDLE_ID: "com.terratech.ovinocaprino"
      groups:
        - ios_signing
        - app_env
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Gerar arquivo .env
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Inicializar keychain
        script: |
          keychain initialize
      - name: Buscar ou criar certificado e provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Adicionar certificado ao keychain
        script: |
          keychain add-certificates
      - name: Configurar assinatura de código no projeto Xcode
        script: |
          xcode-project use-profiles
      - name: Buscar dependências do Flutter
        script: |
          flutter pub get
      - name: Instalar pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build do IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
